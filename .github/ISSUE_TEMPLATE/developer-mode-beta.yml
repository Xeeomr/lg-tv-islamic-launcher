name: Developer Mode auto-renewal Beta feedback
description: Report confirmed renewal or a problem with the opt-in Beta.
title: "[Renewal Beta] "
body:
  - type: markdown
    attributes:
      value: "Thank you for testing. Keep monitoring the official Developer Mode timer. Never share account credentials, session tokens, token files, or authenticated request URLs."
  - type: input
    id: model
    attributes:
      label: TV model and firmware
      placeholder: "LG OLED55C3RLA / 43.21.71"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Home version
      placeholder: "1.1.0"
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Renewal confirmed and official timer increased
        - Enabled but not yet due for renewal
        - Session unavailable or access denied
        - No confirmed increase / another error
  - type: textarea
    id: timer
    attributes:
      label: Official timer before and after / steps taken
      description: Include whether the TV was restarted or offline. Do not include credentials.
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized report from Settings → Diagnostics
      description: Only paste the in-app report, not raw service/network logs.
      render: json
